# Builds release artifacts when a tag like v0.6.0 is pushed.
#
# windows:      the standard build (Parakeet on Vulkan or CPU, Qwen on CPU),
#               with the phrase-bias transcribe.dll. Needs no CUDA toolkit.
#               Produces the zip and the Inno Setup installer, also under the
#               fixed name voclaude-setup.exe that the README and install.ps1
#               download from releases/latest.
# windows-cuda: adds the Qwen engine on NVIDIA GPUs (candle CUDA kernels).
#               STATUS 2026-09-04: the Jimver CUDA install failed on the hosted
#               runner last time; CUDA builds are made locally with
#               `package.ps1 -Cuda -Installer` until this job is verified.
# macos:        Metal build. Compiles on macos-latest (verified 2026-09-04) but
#               has not been run on a Mac; the artifact is unsigned.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Ninja (for the phrase-bias transcribe.dll)
        shell: pwsh
        run: if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) { choco install ninja -y --no-progress }
      - name: Package (zip + installer, phrase-bias transcribe.dll)
        shell: pwsh
        run: .\package.ps1 -Installer -PatchedTranscribe
      - name: Check the package
        shell: pwsh
        run: |
          $zip = Get-ChildItem dist/voclaude-v*.zip | Where-Object Name -notlike "*-cuda*" | Select-Object -First 1
          Expand-Archive $zip.FullName -DestinationPath check
          ./check/voclaude.exe --version
          if (-not (Test-Path dist/voclaude-setup.exe)) { throw "voclaude-setup.exe missing" }
          if (-not (Test-Path vendor/transcribe-patched/transcribe.dll)) { throw "phrase-bias transcribe.dll missing" }
      - uses: actions/upload-artifact@v4
        with:
          name: voclaude-windows
          path: |
            dist/*.zip
            dist/*-setup.exe
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*-setup.exe

  windows-cuda:
    runs-on: windows-2022 # CUDA 12.x does not accept VS 2025 on windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: ilammy/msvc-dev-cmd@v1 # nvcc needs cl.exe on PATH
      - name: Install CUDA toolkit
        uses: Jimver/cuda-toolkit@v0.2.27
        with:
          cuda: "13.0.0"
          method: network
          sub-packages: '["nvcc", "cudart", "cublas", "cublas_dev", "curand", "curand_dev", "nvrtc", "nvrtc_dev"]'
      - name: Package (CUDA zip + installer)
        shell: pwsh
        env:
          # Runners have no GPU, so candle-kernels cannot ask nvidia-smi.
          # 7.5 = GTX 16xx / RTX 20xx; newer GPUs JIT the PTX.
          CUDA_COMPUTE_CAP: "75"
        run: .\package.ps1 -Cuda -Installer
      - uses: actions/upload-artifact@v4
        with:
          name: voclaude-windows-cuda
          path: |
            dist/*-cuda.zip
            dist/*-cuda-setup.exe
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*-cuda.zip
            dist/*-cuda-setup.exe

  macos:
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build (Metal)
        run: cargo build --release --features metal
      - name: Package
        run: |
          mkdir -p dist/voclaude-macos
          cp target/release/voclaude dist/voclaude-macos/
          cp config.example.toml README.md dist/voclaude-macos/
          (cd dist && zip -r voclaude-macos.zip voclaude-macos)
      - uses: actions/upload-artifact@v4
        with:
          name: voclaude-macos
          path: dist/voclaude-macos.zip
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/voclaude-macos.zip
