# Build configuration for Voclaude.
#
# Quantized (Q8_0) CPU inference in the Qwen engine uses candle's AVX2 dot
# products, which are selected at compile time. Every x86-64 CPU since 2013
# has AVX2+FMA.
#
# CUDA (the optional `cuda` feature) is found through the CUDA_PATH environment
# variable of the shell that runs cargo; `[target.*.env]` tables are not valid
# cargo configuration and were removed.

[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+avx2,+fma"]

[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "target-feature=+avx2,+fma"]
