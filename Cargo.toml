[package]
name = "voclaude"
version = "0.4.0"
edition = "2021"
description = "Voice input anywhere - local-first, GPU-accelerated speech-to-text"
license = "MIT"
repository = "https://github.com/matvei77/Voclaude"

[dependencies]
# Audio capture
cpal = "0.15"

# UI
tray-icon = "0.19"
global-hotkey = "0.6"
image = "0.25"
eframe = { version = "0.27", default-features = true }
winit = "0.29"

# System
arboard = "3.4"            # Clipboard
directories = "5.0"        # Config paths
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
crossbeam-channel = "0.5"  # Fast MPSC channels

# Local HTTP API + file decoding
tiny_http = "0.12"
symphonia = { version = "0.5", default-features = false, features = ["mp3", "aac", "isomp4", "mkv", "flac", "wav", "pcm", "ogg", "vorbis", "alac", "adpcm"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# FFT for mel spectrogram
realfft = "3.4"

# ML inference (Candle)
candle-core = "0.9"
candle-nn = "0.9"
candle-transformers = "0.9"
safetensors = "0.7"
tokenizers = "0.22"
hf-hub = "0.4"
ureq = "2"               # API CLI client (already pulled in by hf-hub)
half = "2.4"
num-traits = "0.2"

# Windows message loop
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_UI_WindowsAndMessaging", "Win32_System_Console"] }

[target.'cfg(target_os = "windows")'.build-dependencies]
winresource = "0.1"      # embeds assets/icon.ico into voclaude.exe

[target.'cfg(not(target_os = "windows"))'.dependencies]
notify-rust = "4.11"

[features]
default = ["cuda"]
cuda = ["candle-core/cuda", "candle-nn/cuda"]
metal = ["candle-core/metal", "candle-nn/metal"]
cpu = []

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3

[profile.dev]
opt-level = 1              # Faster dev builds but not painfully slow

[patch.crates-io]
# candle-core with cudarc "dynamic-loading": CUDA DLLs are loaded on first
# GPU use instead of at process start, so the tray process never maps them.
candle-core = { path = "vendor/candle-core" }
# candle-kernels without the MoE kernels: those need bf16 tensor-core fragments
# (compute 8.0+) and Voclaude does not use them, so they are stubbed to let the
# PTX build target compute 7.5 (GTX 16xx / RTX 20xx).
candle-kernels = { path = "vendor/candle-kernels" }
float8 = { path = "vendor/float8" }
