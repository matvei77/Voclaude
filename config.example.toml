# Voclaude configuration
# Location: %APPDATA%\voclaude\Voclaude\config\config.toml

# Hotkey to toggle recording
hotkey = "F4"

# Hotkey to toggle history window
history_hotkey = "Ctrl+Shift+H"

# Language hint (comment out for auto-detect)
# language = "en"

# Formatting
add_trailing_space = true
capitalize_first = true

# Unload model after N seconds idle (saves VRAM).
# Model also unloads immediately after each transcription.
idle_unload_seconds = 30

# Show OS notifications
show_notifications = true

# Maximum history entries
history_max_entries = 500

# GPU acceleration (CUDA)
use_gpu = true

# Model tier:
#   fast / small / medium  = Qwen3-ASR-0.6B, lower memory, best for CPU or laptop GPUs
#   best / large / accurate = Qwen3-ASR-1.7B, highest quality, best for stronger NVIDIA GPUs
model_tier = "medium"

# If true, choose a conservative model for the selected CPU/GPU path unless `model` is set.
auto_select_model = false

# Model (HuggingFace repo id, downloaded automatically on first use).
# Comment this out if you want model_tier to pick the model.
model = "Qwen/Qwen3-ASR-1.7B"

# Optional: path to local model directory (safetensors)
# model_path = "C:/models/Qwen3-ASR-1.7B"

# Max tokens per transcription
max_new_tokens = 2048

# For short dictation, allocate fewer decode-cache tokens automatically.
adaptive_max_new_tokens = true

# Split long audio at silence boundaries. Lower values reduce peak memory and
# can help CPU/low-VRAM systems, but may slightly hurt context across chunks.
max_chunk_seconds = 300

# Require GPU (fail if CUDA unavailable)
require_gpu = false
